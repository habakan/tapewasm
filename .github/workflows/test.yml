name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job here writes anything back — read-only is the whole token this
# workflow needs, and it keeps a compromised third-party action from
# reaching the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned by commit SHA, not by tag: a tag is mutable,
# so a compromised action repository could re-point `v2` and run arbitrary
# code with this workflow's token on the next CI run. `uses:` can't read the
# env context, so each pin is written out at its call site with a trailing
# comment naming the release.
#
# `dtolnay/rust-toolchain` is pinned to `master` rather than to one of its
# per-version branches: those branches are what normally selects the toolchain
# (`@stable`, `@1.88`), and a SHA pin loses that, so every job passes
# `toolchain:` explicitly instead.

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: make fmt-check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make clippy

  test:
    name: cargo test (native, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make test TESTFLAGS=--release

  msrv:
    name: cargo test (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keeps `rust-version` in the workspace Cargo.toml honest — nuts-rs 0.18
      # needs edition 2024 + let-chains, so anything below this does not build.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make test

  no-wasm-gc:
    name: confirm no wasm-gc or relaxed SIMD opcodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --target wasm32-unknown-unknown -p tapewasm --release
      - run: cargo test -p tapewasm-codegen --test no_wasm_gc

  browser:
    name: a compiled module in three engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Pinned rather than `latest` so a wasm-pack release can't change
          # what CI actually verified.
          version: "v0.13.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: make wasm
      # The JS facade: a binding can ship in the wasm and be unreachable
      # through the package with every Rust test still green.
      - run: make smoke
      - run: npm ci
        working-directory: browser-tests
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: browser-tests
      - run: npm test
        working-directory: browser-tests
