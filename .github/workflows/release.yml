name: release

# Runs when a `v*` tag appears. It answers the two questions a release can get
# wrong, and then creates the GitHub release:
#
#   1. does the tag agree with what the manifests actually say?
#   2. did anything ever verify the exact commit the tag points at?
#
# test.yml only runs on pushes to main and on pull requests, so a tag placed on
# an older commit, a rebased branch, or a local commit that was never pushed
# through a PR can otherwise reach a release with nothing having checked it.
#
# Nothing here publishes. Both registries are published by hand from a local
# checkout, and no job holds a credential for either — see RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Action pins follow .github/workflows/test.yml — by commit SHA, never by
# mutable tag. Keep the two files' pins in step; Dependabot bumps both.

jobs:
  guard:
    name: tag matches manifests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          npm_v=$(node -p "require('./ts/package.json').version")
          echo "tag=$tag cargo=$cargo_v npm=$npm_v"
          if [ "$tag" != "$cargo_v" ] || [ "$tag" != "$npm_v" ]; then
            echo "::error::tag $tag does not match Cargo.toml ($cargo_v) / ts/package.json ($npm_v)"
            exit 1
          fi
          # The internal dependency version requirements are written out by
          # hand (see the comment in Cargo.toml), so they can drift from
          # workspace.package.version. A manual `cargo publish` run would hit
          # that drift partway through the three uploads, with the earlier
          # ones already permanent.
          if grep -n 'path = "crates/' Cargo.toml | grep -v "version = \"$cargo_v\""; then
            echo "::error::an internal dependency pins a version other than $cargo_v"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  verify:
    name: verify tagged tree
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: "v0.13.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: make fmt-check
      - run: make clippy
      - run: make test TESTFLAGS=--release
      - run: make wasm
      # The same check RELEASING.md asks for before publishing by hand.
      # Repeated here because the point of this workflow is to notice when the
      # manual procedure was not followed.
      - name: dry-run every manifest and the npm tarball, licence checks included
        run: make package

  github-release:
    name: create the GitHub release
    runs-on: ubuntu-latest
    needs: [guard, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release body is this version's own CHANGELOG section, so the
      # release page and the file cannot drift apart.
      - name: extract the changelog section
        run: |
          set -euo pipefail
          awk -v v="${{ needs.guard.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md \
            | sed '/^\[[^]]*\]: http/d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG section for ${{ needs.guard.outputs.version }}"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --prerelease
